<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The inner garden · B (preview)</title><meta name="robots" content="noindex">
<meta name="description" content="Ten ways to plant a ten-meter strip of light. Walk through each and tell us which one you would live beside.">
<meta property="og:title" content="The inner garden · Refugio Botánico">
<meta property="og:description" content="Ten ways to plant a ten-meter strip of light. Walk through each and vote.">
<meta property="og:image" content="img/living-wall-1-t.jpg">
<style>
:root{--bg:#161614;--ink:#ece8df;--mute:#aeaa9e;--dim:#8b877d;--line:#2d2c28;--card:#1d1d1a;--accent:#c9b37a;--love:#d9604c;--w:1500px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.sans{font-family:-apple-system,"Helvetica Neue",system-ui,sans-serif}
.lab{font:600 11.5px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* top bar */
header.bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:18px;padding:14px 24px;background:#161614d9;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #ffffff0d}
@media(max-width:560px){header.bar{padding:10px 14px;gap:8px}.brand{font-size:10.5px;line-height:1.3}nav.top a{padding:8px 9px;font-size:12.5px}}
.brand{font:600 12px/1 -apple-system,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
nav.top{margin-left:auto;display:flex;gap:6px}
nav.top a{font:500 13px/1 -apple-system,system-ui,sans-serif;text-decoration:none;color:var(--mute);padding:9px 13px;border-radius:99px}
nav.top a:hover,nav.top a.on{color:var(--ink);background:#ffffff14}
.sp{flex:1}

/* intro */
.hero{position:relative;height:calc(100svh + var(--run,800svh))}
.hstage{position:sticky;top:0;height:100svh;min-height:520px;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3.4vh,34px);padding:62px 0 clamp(18px,3vh,32px)}
.pic{position:relative;width:min(100%,calc((100svh - 215px) * 2.357));aspect-ratio:6336/2688;margin:0 auto;container-type:inline-size;background:#222}
.pic picture{display:contents}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pic .gi{opacity:0}
.pic .l1{--p:0;opacity:1;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(var(--p) * 140% - 40%),transparent calc(var(--p) * 140%));mask-image:linear-gradient(90deg,#000 0,#000 calc(var(--p) * 140% - 40%),transparent calc(var(--p) * 140%))}
.ht{position:absolute;left:5.2cqw;top:17cqw;margin:0;font-weight:400;font-size:8.6cqw;line-height:.98;letter-spacing:-.025em;color:#1b1a17;mix-blend-mode:multiply;pointer-events:none;white-space:nowrap}
.hslot{width:100%;max-width:var(--w);margin:0 auto;padding:0 clamp(20px,5vw,72px);display:grid}
.hslot>*{grid-area:1/1}
.hbar{padding:4px 0 0;margin:0;align-self:start}
.hcap{width:100%;display:grid;padding-top:6px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,5vw,80px);align-items:end}
.hcap .lede{font-size:clamp(17px,1.5vw,21px);line-height:1.5;max-width:40ch;color:#e4e0d6;margin:10px 0 18px}
.hcap .lab{display:block;color:var(--accent);transition:opacity .3s}
.facts{display:flex;gap:clamp(16px,3vw,44px);flex-wrap:wrap;margin:0;justify-content:flex-end}
.facts div b{display:block;font:400 clamp(24px,2.7vw,40px)/1 "Iowan Old Style",Georgia,serif;letter-spacing:-.01em}
.facts div span{display:block;margin-top:6px;font:600 10.5px/1.3 -apple-system,system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.cta{display:inline-flex;gap:10px;align-items:center;font:600 13px/1 -apple-system,system-ui,sans-serif;letter-spacing:.06em;background:var(--ink);color:#161614;border:0;padding:15px 22px;border-radius:99px;cursor:pointer;text-decoration:none}
.cta:hover{background:#fff}
@media(max-aspect-ratio:1/1){
 .hstage{height:100svh;padding-top:60px;gap:10px}
 .pic{width:100%;aspect-ratio:auto;flex:1 1 0;min-height:0}
 .hslot{min-height:78px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
 .pic img{object-position:50% 80%}
 .pic .l1{-webkit-mask-image:linear-gradient(0deg,#000 0,#000 calc(var(--p) * 140% - 40%),transparent calc(var(--p) * 140%));mask-image:linear-gradient(0deg,#000 0,#000 calc(var(--p) * 140% - 40%),transparent calc(var(--p) * 140%))}
 .ht{white-space:normal;font-size:15.5cqw;left:7cqw;top:9cqw;line-height:.95;color:#f4f1ea;mix-blend-mode:normal;text-shadow:0 1px 24px #0007}
 .hcap{grid-template-columns:1fr;gap:16px}
 .facts{justify-content:flex-start}
 .hstage{justify-content:flex-start;padding-top:64px}
}
@media(max-height:620px) and (min-aspect-ratio:1/1){.hcap .lede{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* about strip */
.about{max-width:var(--w);margin:0 auto;padding:clamp(48px,9vh,110px) clamp(20px,5vw,72px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,6vw,100px);align-items:start}
.about h2{font-weight:400;font-size:clamp(30px,3.8vw,56px);line-height:1.06;margin:0;letter-spacing:-.018em;max-width:16ch}
.about p{margin:0 0 1em;color:#e4e0d6;font-size:18px;line-height:1.62;max-width:54ch}
.rules{display:grid;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.rules li{padding-left:22px;position:relative;color:#cbc6b8;font-size:15px}
.rules li::before{content:"";position:absolute;left:0;top:.72em;width:10px;height:1px;background:var(--accent)}
@media(max-width:820px){.about{grid-template-columns:1fr}}

/* index */
.sect{max-width:var(--w);margin:0 auto;padding:0 clamp(20px,5vw,72px) 90px}
.sect>h2{font-weight:400;font-size:clamp(28px,3.4vw,46px);margin:0 0 8px;letter-spacing:-.01em}
.sect>p.sub{color:var(--mute);margin:0 0 26px;max-width:60ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}
.chip{border:1px solid #3a3934;background:transparent;border-radius:99px;padding:8px 15px;font:500 13px/1 -apple-system,system-ui,sans-serif;cursor:pointer;color:var(--mute)}
.chip:hover{color:var(--ink);border-color:#5a5850}
.chip.on{background:var(--ink);color:#161614;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:22px}
.tile{position:relative;background:var(--card);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .35s,border-color .35s}
.tile:hover{transform:translateY(-3px);border-color:#4a483f}
.tile .ph{display:block;aspect-ratio:2.36/1;overflow:hidden;background:#222}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tile:hover .ph img{transform:scale(1.04)}
.tile .meta{padding:16px 18px 14px;display:grid;gap:4px}
.tile h3{margin:0;font-weight:400;font-size:25px;line-height:1.15;letter-spacing:-.005em}
.tile h3 a{text-decoration:none}
.tile h3 a::after{content:"";position:absolute;inset:0}
.tile .num{color:var(--accent);font:600 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.14em}
.tile .one{color:#c6c1b4;font-size:15px}
.tile .foot{display:flex;align-items:center;gap:10px;padding:0 14px 14px 18px;position:relative;z-index:2}
.tile .ins{font:500 12px/1.2 -apple-system,system-ui,sans-serif;color:var(--mute);flex:1;min-width:0}
.tile .ins b{color:#dccf9d;font-weight:500}
.pillbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid #3a3934;background:#161614aa;border-radius:99px;padding:8px 12px;font:500 13px/1 -apple-system,system-ui,sans-serif;cursor:pointer;color:#ddd8cc;white-space:nowrap}
.pillbtn:hover{border-color:#6a6860}
.pillbtn.on{border-color:var(--love);color:#fff;background:#d9604c26}
.pillbtn.pick.on{border-color:var(--accent);background:#c9b37a26}
.heart{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.on .heart{fill:var(--love);stroke:var(--love)}
.tilebadge{position:absolute;top:10px;left:10px;font:600 10px/1 -apple-system,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;background:#161614cc;padding:6px 9px;border-radius:99px;color:#ddd8cc;z-index:2;backdrop-filter:blur(6px)}


/* immersive */
.imm{position:fixed;inset:0;z-index:40;background:#0c0c0b;display:none;overscroll-behavior:contain;touch-action:none}
.imm.open{display:block}
.imm .stage{position:absolute;inset:0;overflow:hidden;cursor:zoom-in;touch-action:none;user-select:none;-webkit-user-select:none}
.imm.zoomed .stage{cursor:grab}
.imm .stage.drag{cursor:grabbing}
.imm .stage img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .35s}
.imm .stage img.ready{opacity:1}
.imm .stage img.anim{transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .35s}
.imm.clean .stage{cursor:none}
.imm.clean.zoomed .stage{cursor:none}
.imm .chrome{transition:opacity .35s}
.imm.idle .chrome,.imm.clean .chrome{opacity:0;pointer-events:none}
.imm.clean.peek .top{opacity:1;pointer-events:auto}
.imm .top{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;gap:12px;padding:16px 22px;background:linear-gradient(#0c0c0bcc,#0c0c0b00);z-index:3;pointer-events:none}
.imm .top>*{pointer-events:auto}
.imm.idle .top>*,.imm.clean .top>*{pointer-events:none}
.imm.clean.peek .top>*{pointer-events:auto}
.imm .top .ttl{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid #4a483f;border-radius:99px;padding:3px;background:#161614cc;backdrop-filter:blur(8px)}
.seg button{border:0;background:transparent;border-radius:99px;padding:8px 15px;font:500 13px/1 -apple-system,system-ui,sans-serif;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--ink);color:#161614}
.imm .top .pillbtn,.imm .icobtn{background:#161614cc;backdrop-filter:blur(8px)}
.icobtn,.xbtn{flex:none;border:1px solid #4a483f;background:#161614cc;border-radius:99px;width:40px;height:40px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink);display:inline-grid;place-items:center}
.icobtn:hover,.xbtn:hover{background:#2a2924}
.xbtn{font-size:22px}
.imm .arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;border:1px solid #4a483f;background:#161614cc;width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:20px;color:var(--ink);backdrop-filter:blur(8px)}
.imm .arrow.l{left:18px}.imm .arrow.r{right:18px}
.imm .arrow:hover{background:#2a2924}
.imm .hint{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);font:500 12px/1.3 -apple-system,system-ui,sans-serif;color:#ddd8cc;background:#161614d9;padding:10px 16px;border-radius:99px;pointer-events:none;white-space:nowrap;z-index:3;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.imm .hint.gone{opacity:0}
.imm.sharpen #zl{animation:zp 1s ease-in-out infinite}
@keyframes zp{50%{opacity:.35}}
.zbar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#161614d9;border:1px solid #4a483f;border-radius:99px;padding:4px;z-index:3;backdrop-filter:blur(8px)}
.zbar button{border:0;background:transparent;color:var(--ink);width:38px;height:36px;border-radius:99px;font-size:20px;cursor:pointer;line-height:1}
.zbar button:hover{background:#ffffff14}
.zbar button.fit{width:auto;padding:0 14px;font:600 12px/1 -apple-system,system-ui,sans-serif;letter-spacing:.04em}
.zbar .zl{font:500 12px/1 -apple-system,system-ui,sans-serif;color:var(--mute);min-width:50px;text-align:center}
.mini{position:absolute;right:20px;bottom:20px;z-index:3;border:1px solid #4a483f;background:#161614d9;border-radius:4px;overflow:hidden;display:none;backdrop-filter:blur(8px)}
.imm.zoomed .mini{display:block}
.mini i{position:absolute;border:1.5px solid var(--accent);background:#c9b37a22;border-radius:2px}
.immpanel{display:none}
@media(min-width:1000px){.imm.side:not(.clean) .immpanel{display:block;position:absolute;right:0;top:0;bottom:0;width:380px;background:#161614f2;border-left:1px solid #2d2c28;padding:84px 26px 28px;overflow:auto;z-index:2;touch-action:pan-y}.imm.side:not(.clean) .stage{right:380px}.imm.side:not(.clean) .arrow.r{right:398px}.imm.side:not(.clean) .mini{right:400px}.immpanel h2{font-weight:400;font-size:30px;margin:6px 0 8px}.immpanel p{color:#ddd8cc;margin:0 0 18px;font-size:15.5px}.immpanel .lab{display:block;margin:16px 0 8px}.immpanel .pal b{font-size:16px}}
@media(max-width:560px){.imm .top{padding:12px 12px;gap:8px}.imm .top .ttl{font-size:15px}.seg button{padding:7px 11px}.imm .top .pillbtn{padding:8px 10px}.imm .arrow{width:40px;height:40px}.imm .arrow.l{left:8px}.imm .arrow.r{right:8px}.mini{right:10px;bottom:70px}}
.edge{position:absolute;left:0;right:0;top:0;height:64px;z-index:2;display:none}
.imm.clean .edge{display:block}
.imm .rail{display:none}

/* detail page */
.detail{max-width:var(--w);margin:0 auto;padding:96px clamp(20px,5vw,72px) 100px}
.crumb{font:500 13px/1 -apple-system,system-ui,sans-serif;color:var(--mute);text-decoration:none;display:inline-block;margin-bottom:22px}
.crumb:hover{color:var(--ink)}
.dhead{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(20px,5vw,80px);align-items:end;margin-bottom:26px}
.dhead h1{font-weight:400;font-size:clamp(38px,6vw,86px);line-height:1;margin:8px 0 0;letter-spacing:-.02em}
.dhead p{font-size:clamp(17px,1.7vw,21px);color:#d6d1c4;margin:0}
@media(max-width:820px){.dhead{grid-template-columns:1fr}}
.frame{position:relative;border-radius:6px;overflow:hidden;background:#222;cursor:zoom-in;border:1px solid var(--line)}
.frame img{display:block;width:100%;height:auto}
.frame .enter{position:absolute;right:16px;bottom:16px;background:var(--ink);color:#161614;border:0;border-radius:99px;padding:13px 19px;font:600 13px/1 -apple-system,system-ui,sans-serif;letter-spacing:.04em;cursor:pointer}
.frame .enter:hover{background:#fff}
.pair{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(22px,4vw,64px);margin-top:46px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.sidecard{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:18px;cursor:pointer}
.sidecard img{width:100%;display:block;border-radius:3px}
.sidecard h4{margin:0 0 4px;font-weight:400;font-size:20px}
.sidecard p{margin:0;color:var(--mute);font-size:14.5px}
.kv{display:grid;grid-template-columns:130px 1fr;border-top:1px solid var(--line)}
.kv>*{padding:13px 0;border-bottom:1px solid var(--line)}
.kv dt{font:600 10.5px/1.6 -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-top:15px}
.kv dd{margin:0;color:#e0dbcd}
.pal{display:grid;gap:0;margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.pal li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pal b{font-weight:400;font-size:18px}
.pal i{color:var(--mute);font-size:14px}
.pal em{font:600 10px/1 -apple-system,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-style:normal}
.note{background:var(--card);border-left:2px solid var(--accent);padding:14px 18px;color:#ddd8cc;margin:22px 0 0;font-size:15px}
.note .lab{display:block;margin-bottom:6px;color:var(--accent)}
.votebox{position:sticky;top:78px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
.votebox h3{margin:0 0 4px;font-weight:400;font-size:24px}
.votebox p{margin:0 0 16px;color:var(--mute);font-size:14.5px}
.votebox .row{display:grid;gap:10px}
.votebox .pillbtn{justify-content:center;padding:14px 16px;font-size:14px}
.rkrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rkrow .pillbtn{justify-content:center;padding:12px 8px}
.mytop{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;font-size:15px}
.mytop li{display:flex;gap:10px;align-items:baseline;color:#e9e5da}
.mytop li span{font:600 11px/1 -apple-system,system-ui,sans-serif;color:var(--accent);width:14px}
.mytop li.empty{color:var(--dim)}
.tally{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font:500 13px/1.3 -apple-system,system-ui,sans-serif;color:var(--mute)}
.tally b{display:block;color:var(--ink);font:400 26px/1 Georgia,serif;margin-bottom:4px}
.plan{margin-top:26px}
.plan svg{width:100%;height:auto;display:block}
.pn{display:flex;justify-content:space-between;margin-top:36px;gap:12px}
.pn a{flex:1;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.pn a:hover{border-color:#5a5850}
.pn a.r{text-align:right}
.pn b{display:block;font-weight:400;font-size:21px;margin-top:6px}

.tagsr{display:flex;flex-wrap:wrap;gap:6px}
.tagsr span{font:500 12.5px/1 -apple-system,system-ui,sans-serif;border:1px solid #3a3934;border-radius:99px;padding:6px 10px;color:#ddd8cc}
.tagsr span.shared{border-color:var(--accent);color:var(--accent)}
.meter{height:5px;background:#2a2924;border-radius:9px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--mute);padding:60px 0;text-align:center}

/* results */
.bars{display:grid;gap:12px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 70px;gap:14px;align-items:center;text-decoration:none}
.bar .nm{font-size:18px}
.bar .tr{height:34px;background:#232320;border-radius:5px;overflow:hidden;position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a6a3a,var(--accent));transition:width .9s cubic-bezier(.2,.7,.2,1);width:0}
.bar .tr i.love{background:linear-gradient(90deg,#8a3a30,var(--love))}
.bar .ct{font:500 14px/1 -apple-system,system-ui,sans-serif;color:var(--mute);text-align:right}
.resgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,70px)}
@media(max-width:900px){.resgrid{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 40px}}
.banner{font:500 13px/1.45 -apple-system,system-ui,sans-serif;color:var(--mute);border:1px dashed #4a483f;border-radius:6px;padding:11px 14px;margin:0 0 24px}
.toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#161614;font:600 13px/1 -apple-system,system-ui,sans-serif;padding:12px 18px;border-radius:99px;z-index:90;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{scroll-snap-align:end;max-width:var(--w);margin:0 auto;padding:30px clamp(20px,5vw,72px) 50px;color:var(--dim);font:13px/1.6 -apple-system,system-ui,sans-serif;border-top:1px solid var(--line)}

/* ---------- phones ---------- */
.tile .ph picture{display:contents}
@media(max-width:560px){
 .frame.sideph{aspect-ratio:4/5}.frame.sideph img{height:100%;object-fit:cover;object-position:50% 78%}
 .grid{grid-template-columns:1fr 1fr;gap:12px}
 .tile .ph{aspect-ratio:3/4}
 .tile .meta{padding:12px 12px 6px}.tile h3{font-size:19px}.tile .one,.tile .ins{display:none}
 .tilebadge{left:8px;top:8px;font-size:9.5px;padding:5px 8px}
 .empty{padding:28px 0}
}

@supports (grid-template-rows:subgrid){
}

function preloadDetail(k){idle(()=>{if(saver())return;
  ["n","m"].forEach(v=>preload(`img/${k}-${v}.jpg`));
  const i=G.findIndex(g=>g.k===k),first=(detail.v||(PH()?"side":"front"))==="side"?"n":"m";
  [1,-1].forEach(d=>{const n=G[(i+d+G.length)%G.length];preload(`img/${n.k}-${first}.jpg`)});
  if(PH()&&!preloadDetail.all&&(navigator.connection?.effectiveType||"4g")==="4g"){preloadDetail.all=1;
    const order=G.map((g,j)=>[Math.min((j-i+G.length)%G.length,(i-j+G.length)%G.length),g]).sort((x,y)=>x[0]-y[0]);

/* once the small hero images are all in, swap in the large ones one by one, in scroll order */
function upgradeHero(){
  const imgs=$$("#hpic img[data-hi]");if(!imgs.length||saver())return;
  const ph=PH();if(ph&&(navigator.connection?.effectiveType||"4g")!=="4g")return;
  const ready=Promise.all(imgs.map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve()));
  ready.then(()=>idle(async()=>{
    for(const im of imgs){
      if(!im.isConnected)return;
      const u=ph?im.dataset.hs:im.dataset.hi;
      await new Promise(r=>{const t=new Image();t.onload=()=>{if(im.isConnected){im.src=u;const so=im.parentElement.querySelector("source");if(so)so.srcset=u}r()};t.onerror=r;t.src=u});

    G.forEach(g=>{preload(`img/${g.k}-st.jpg`);preload(`img/${g.k}-t.jpg`)});
    if(!ph&&(navigator.connection?.effectiveType||"4g")==="4g")for(const g of G){await new Promise(r=>setTimeout(r,250));preload(`img/${g.k}-n.jpg`)}}))}

const ptrs=new Map();let g0=null,moved=0,lastTap=null,tapT=null;
const stPt=e=>{const r=stage.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};

  if(lastTap&&now-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<40){clearTimeout(tapT);lastTap=null;toggleZoom(cx,cy);return}
  lastTap={t:now,x:e.clientX,y:e.clientY};
  tapT=setTimeout(()=>{lastTap=null;if(clean){imm.classList.contains("peek")?imm.classList.remove("peek"):peek()}else{imm.classList.contains("idle")?showChrome():(imm.classList.add("idle"),clearTimeout(idleT))}},330)};
stage.addEventListener("pointerup",endPtr);stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("wheel",e=>{e.preventDefault();const[cx,cy]=stPt(e);
  if(!e.ctrlKey&&Math.abs(e.deltaX)>Math.abs(e.deltaY)*1.5){if(z>1.01){tx-=e.deltaX;apply()}return}
  if(e.shiftKey&&z>1.01){tx-=e.deltaY;apply();return}
  const k=Math.exp(-e.deltaY*(e.ctrlKey?0.012:(e.deltaMode===1?0.05:0.0018)));zoomAt(z*k,cx,cy)},{passive:false});
stage.addEventListener("dragstart",e=>e.preventDefault());
imm.addEventListener("contextmenu",e=>{if(e.target===immimg)e.preventDefault()});

/* keyboard */
addEventListener("keydown",e=>{
  if(!imm.classList.contains("open")||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==="Escape"){if(clean&&!document.fullscreenElement)setClean(false);else closeImm()}
  else if(k==="ArrowRight")step(1);else if(k==="ArrowLeft")step(-1);
  else if(k==="+"||k==="=")zoomAt(z*1.4,...center(),true);
  else if(k==="-"||k==="_")zoomAt(z/1.4,...center(),true);
  else if(k==="0")fit(true);
  else if(k==="f"||k==="F"){e.preventDefault();toggleFull()}
  else if(k==="v"||k==="V")setView(view==="front"?"side":"front");
  else if(k==="l"||k==="L"){toggleLove(cur).then(()=>{paintLove();paintPanel(BY[cur])})}
  else if(k==="c"||k==="C")setClean(!clean)});

/* ---------- global click delegation ---------- */
document.addEventListener("click",e=>{
  const ln=e.target.closest("a");if(ln&&!ln.matches("[data-home],[data-top]"))return;
  const t=e.target.closest("[data-love],[data-pick],[data-f],[data-imm],[data-dv],[data-home],[data-top]");if(!t)return;
  if(t.dataset.love){e.preventDefault();toggleLove(t.dataset.love)}
  else if(t.dataset.pick){e.preventDefault();setPick(t.dataset.pick)}
  else if(t.dataset.f){home.f=t.dataset.f;route(true)}
  else if(t.dataset.dv){detail.v=t.dataset.dv;route(true)}
  else if(t.dataset.top!==undefined){homeY=0;if($("#hero"))scrollTo({top:0,behavior:"instant"})}
  else if(t.dataset.home!==undefined){e.preventDefault();location.hash="#gardens"}
  else if(t.dataset.imm){if(Date.now()-swipedAt<500)return;openImm(t.dataset.imm,t.dataset.v)}});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("[data-imm]")){e.preventDefault();openImm(e.target.dataset.imm,e.target.dataset.v)}});

/* detail: arrow keys and swipe move between gardens */
let swipedAt=0;
function detailStep(d){const m=location.hash.match(/^#\/g\/(.+)$/);if(!m||imm.classList.contains("open"))return;const i=G.findIndex(g=>g.k===m[1]);if(i<0)return;location.hash="#/g/"+G[(i+d+G.length)%G.length].k}
addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.target.matches?.("input,textarea"))return;if(e.key==="ArrowRight")detailStep(1);else if(e.key==="ArrowLeft")detailStep(-1)});
let sw=null;
document.addEventListener("touchstart",e=>{sw=e.target.closest?.("#fwrap")&&e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});
document.addEventListener("touchend",e=>{if(!sw)return;const t=e.changedTouches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;sw=null;if(Math.abs(dx)>60&&Math.abs(dy)<45){swipedAt=Date.now();detailStep(dx<0?1:-1)}},{passive:true});
/* ---------- hero: the strip fills as you scroll ---------- */
let heroRaf=0,heroIdx=-1;
const ease=t=>{t=Math.min(1,Math.max(0,t));return t*t*(3-2*t)};
function paintBar(i){
  heroIdx=i;const g=G[i];if(!g)return;
  $("#hnum").textContent=`${String(i+1).padStart(2,"0")} / ${G.length} · ${g.mood}`;$("#hname").textContent=g.n;
  $("#hdet").href=`#/g/${g.k}`;const h=$("#hheart"),on=mine.love.includes(g.k);h.dataset.love=g.k;h.classList.toggle("on",on);h.setAttribute("aria-pressed",on);
  const pic=$("#hpic");pic.dataset.imm=g.k;pic.dataset.v=PH()?"side":"front"}
function heroUpdate(){
  heroRaf=0;const h=$("#hero");if(!h)return;
  const run=h.offsetHeight-innerHeight,r=h.getBoundingClientRect();
  const P=Math.min(1,Math.max(0,-r.top/Math.max(1,run)));
  const N=G.length,k0=ease(P/0.12);
  const imgs=$$("#hpic .gi");
  imgs[0].style.setProperty("--p",k0.toFixed(4));
  const u=Math.min(1,Math.max(0,(P-0.12)/0.88))*N;
  const cur=Math.min(N-1,Math.floor(u)),f=u-cur;
  const nt=cur<N-1&&f>0.6?ease((f-0.6)/0.4):0;
  imgs.forEach((im,i)=>{if(i===0){im.style.opacity=1;return}im.style.opacity=i<=cur?1:(i===cur+1?nt.toFixed(3):0)});
  const idx=nt>0.5?cur+1:cur;if(idx!==heroIdx)paintBar(idx);
  $(".ht").style.opacity=Math.max(0,1-k0*2.4).toFixed(3);
  const b=ease((P-0.1)/0.07),bar=$("#hbar"),intro=$("#hintro");
  bar.style.opacity=b.toFixed(3);bar.style.visibility=b<0.02?"hidden":"visible";
  intro.style.opacity=(1-b).toFixed(3);intro.style.visibility=b>0.98?"hidden":"visible";
  $("#hlab").textContent=k0<.04?"The strip today · scroll to plant it":"Planting…"}
addEventListener("scroll",()=>{if(!heroRaf)heroRaf=requestAnimationFrame(heroUpdate)},{passive:true});
/* ---------- boot ---------- */
// always start at the top on reload: the browser's own restore fights the late render and lands mid-hero
if('scrollRestoration' in history)history.scrollRestoration='manual';
addEventListener('pageshow',e=>{if(e.persisted)scrollTo(0,0)});
flush().then(()=>loadAgg()).then(()=>route(false));
route(false);
</script>
